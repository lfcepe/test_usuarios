# Sirve el frontend compilado y hace de puerta de entrada unica hacia las dos
# APIs. Con esto el navegador solo conoce un origen: no hay CORS que resolver ni
# puertos distintos codificados en el bundle de JavaScript.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React Router maneja el enrutado en el cliente: cualquier ruta desconocida
    # tiene que devolver index.html o una recarga en /clientes daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/(clientes|personas|catalogos) {
        proxy_pass http://devsu-clientes-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(cuentas|movimientos|reportes) {
        proxy_pass http://devsu-cuentas-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
